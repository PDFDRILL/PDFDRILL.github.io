name: Deploy to Pages

# Replaces the legacy Pages builder, which timed out at ten minutes on this
# repo. The cause was history, not the working tree: four pushes on 2026-08-06
# left ~100 MB of large blobs behind, and removing them from HEAD did not help
# because the legacy build still fetches the repository. actions/checkout
# shallow-clones by default, so that history is never pulled.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        # fetch-depth: 1 is the default and is the point of this change.

      - name: Refuse to publish an artefact nobody chose
        # reports/<bibkey>/ sits next to a working directory whose files share
        # its prefix: report.tex, report.log, report.refined.pdf, and the
        # quarantined report.ink.json.MISPAIRED all match `report.*`. Three
        # sessions write into that library. An allowlist here means a stray
        # file fails the deploy loudly instead of going live quietly - the one
        # way a withdrawn or unreviewed artefact could reach the site without
        # anyone deciding to publish it.
        run: |
          python3 - <<'GUARD'
          import json, os, sys, glob

          ALLOWED = ("report.pdf", "report.ink.json", "report.build.json", "inspect.html", "compare.html")
          errs = []

          if not os.path.isdir("reports"):
              print("::error::reports/ is missing - refusing to publish"); sys.exit(1)
          dirs = sorted(d for d in glob.glob("reports/*/") if os.path.isdir(d))
          if not dirs:
              print("::error::reports/ has no document folders - refusing to publish"); sys.exit(1)

          def content_ok(path, name):
              """Is this file the thing its name claims? Names are cheap to get
              right and prove nothing: a zero-byte report.pdf passes any check
              that only reads the filename."""
              n = os.path.getsize(path)
              if n == 0:
                  return "zero bytes"
              with open(path, "rb") as fh:
                  head = fh.read(1024)
                  fh.seek(max(0, n - 2048)); tail = fh.read()
              if name.endswith(".pdf"):
                  if not head.startswith(b"%PDF"):
                      return "no %%PDF header"
                  if b"%%EOF" not in tail:
                      return "no %%EOF trailer - truncated"
              elif name.endswith(".html"):
                  if b"<" not in head:
                      return "no markup"
              elif name.endswith(".json"):
                  try:
                      json.load(open(path, encoding="utf-8"))
                  except Exception as e:
                      return f"unparseable JSON: {e}"
              return None

          checked = 0
          for d in dirs:
              k = os.path.basename(d.rstrip("/"))
              for root, _, files in os.walk(d):
                  for b in sorted(files):
                      p = os.path.join(root, b)
                      checked += 1
                      if b not in ALLOWED and b != f"{k}.md":
                          errs.append((p, "unexpected file in a published report folder"))
                          continue
                      why = content_ok(p, b)
                      if why:
                          errs.append((p, f"named {b} but {why}"))

          # Counts make the verdict falsifiable at a glance; the content checks
          # make its INPUTS falsifiable. A guard that inspected nothing, and a
          # guard that inspected an empty file, both otherwise report success.
          # A stamp that has stopped describing its own file is the failure it
          # exists to prevent, so check it before trusting anything it says.
          import hashlib
          for d in dirs:
              st = os.path.join(d, "report.build.json")
              if not os.path.exists(st):
                  continue
              try:
                  b = json.load(open(st, encoding="utf-8"))
              except Exception as e:
                  errs.append((st, f"unparseable build stamp: {e}")); continue
              pdf = os.path.join(d, b.get("pdf", "report.pdf"))
              if not os.path.exists(pdf):
                  errs.append((st, f"stamp names {b.get('pdf')!r}, which is not published")); continue
              raw = open(pdf, "rb").read()
              if b.get("bytes") != len(raw):
                  errs.append((st, f"stamp says {b.get('bytes')} bytes, file is {len(raw)} "
                                   f"-- the stamp no longer describes the report beside it"))
              elif b.get("sha256") and b["sha256"] != hashlib.sha256(raw).hexdigest():
                  errs.append((st, "stamp sha256 does not match the report beside it"))

          if checked == 0:
              print("::error::guard inspected 0 files - refusing to publish"); sys.exit(1)
          for p, why in errs:
              print(f"::error file={p}::{why}: {p}")
          if errs:
              print(f"reports/: {len(errs)} problem(s) - refusing to publish"); sys.exit(1)
          print(f"reports/: {len(dirs)} document folders, {checked} files, "
                f"every one an allowed artefact and structurally valid")

          # ---- the page's CLAIMS against the artefacts they describe --------
          # index.html is written by hand from numbers read out of the files.
          # That correspondence is a guarantee I have been relying on without
          # asserting: artefacts here are regenerated by other sessions, and a
          # regenerated ink.json leaves the table quietly describing the old one.
          import re, collections
          idx = open("reports/index.html", encoding="utf-8").read()
          claim_errs = []

          listed = set(re.findall(r'<code class="doc">([^<]+)</code>', idx))
          have = {os.path.basename(d.rstrip("/")) for d in dirs}
          for k in sorted(have - listed):
              claim_errs.append(f"{k} is published but has no row in index.html")
          for k in sorted(listed - have):
              claim_errs.append(f"index.html lists {k} but reports/{k}/ does not exist")

          LET = {"component": "C", "weak": "W", "stable": "S", "noise": "N", "clean": "K"}
          for m in re.finditer(r'<code class="doc">([^<]+)</code>(.*?)</tr>', idx, re.S):
              k, cell = m.group(1), m.group(2)
              ink = f"reports/{k}/report.ink.json"
              if not os.path.exists(ink):
                  continue
              rows_ = json.load(open(ink, encoding="utf-8"))["rows"]
              n = re.search(r'<td class="n">(\d[\d,]*)', cell)
              if n and int(n.group(1).replace(",", "")) != len(rows_):
                  claim_errs.append(
                      f"{k}: table says {n.group(1)} equations, report.ink.json has {len(rows_)} rows")
              dist = collections.Counter(x["flag"] for x in rows_)
              # The legend defines exactly these five classes, once, for the whole
              # table. A sixth appearing in an artefact means the legend has
              # stopped describing the data -- last week's failure running the
              # other way. pdfdrill-7b has an "absent" flag in flight, so this is
              # imminent rather than hypothetical. Name it; do not KeyError.
              unknown = sorted(set(dist) - set(LET))
              if unknown:
                  claim_errs.append(
                      f"{k}: report.ink.json uses residual class(es) {unknown}, which the "
                      f"legend does not define (it defines {sorted(LET)}). The legend needs "
                      f"updating in the same commit that publishes this artefact.")
                  continue
              # Is the measurement CREDIBLE, not merely present and correctly
              # described? Per row, compare the render's component count with the
              # scan's: max/max(1,min), scale- and order-free. A genuinely
              # mis-transcribed equation SHOULD differ wildly, so a per-row cap
              # would refuse real findings -- the p90 asks whether MOST rows pair,
              # which is the pairing question. pdfdrill-7b's corpus puts every
              # sound document at p90 <= 1.07 and every suspect one at >= 6.71;
              # 3.0 sits in that empty band rather than being tuned to it.
              ratios = sorted(max(x["L"][0], x["R"][0]) / max(1, min(x["L"][0], x["R"][0]))
                              for x in rows_)
              if ratios:
                  p90 = ratios[min(len(ratios) - 1, int(round(0.9 * (len(ratios) - 1))))]
                  if p90 >= 3.0:
                      claim_errs.append(
                          f"{k}: report.ink.json p90 component ratio {p90:.2f} (>= 3.0) -- most "
                          f"rows do not pair, so the render and the scan cell are not the same "
                          f"cell. Present, valid and correctly described, but not credible.")
                      continue
              # Provenance, where the artefact carries it. An ink.json with no
              # measured_against is UNRECORDED, not failed -- every measurement
              # predating the stamp lacks it, including all six published here.
              # A stamp arriving must not retroactively condemn artefacts that
              # could not have carried it.
              prov = json.load(open(ink, encoding="utf-8")).get("measured_against")
              if isinstance(prov, dict):
                  if prov.get("phase") != "measure":
                      claim_errs.append(
                          f"{k}: report.ink.json was measured against a build with "
                          f"phase={prov.get('phase')!r}, not 'measure' -- the measurement saw "
                          f"a report carrying the legend and/or bullets it was meant to exclude.")
                      continue
              want = {LET[f]: v for f, v in dist.items()}
              got = {a: int(b) for a, b in re.findall(r">([CWSNK])</b>(\d+)", cell)}
              if got and got != want:
                  claim_errs.append(f"{k}: residual bar {got} does not match report.ink.json {want}")

          for e in claim_errs:
              print(f"::error file=reports/index.html::{e}")
          if claim_errs:
              print(f"reports/index.html: {len(claim_errs)} claim(s) contradict the artefacts - refusing to publish")
              sys.exit(1)
          print(f"reports/index.html: {len(listed)} rows, each matching the artefact it describes")
          GUARD

      - name: Stage the site
        # Copy to a clean directory rather than uploading the checkout itself,
        # so .git and CI config can never end up in the published artifact.
        run: |
          mkdir -p _site
          # figures/ stays: index.html links figures/ and
          # figures/specs/overview.fig.json from the hero caption.
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.pstknot-work' \
            --exclude 'node_modules'
          test -f _site/.nojekyll || touch _site/.nojekyll
          echo "staged $(du -sh _site | cut -f1), $(find _site -type f | wc -l) files"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Default is 600000 (10 min), and this artifact is ~65 MB: the
          # deployment reached "deployment_in_progress" and was still running
          # when the action gave up and cancelled it. Give it 30 minutes.
          timeout: 1800000
          error_count: 10
          reporting_interval: 15000
