name: Deploy to Pages

# Replaces the legacy Pages builder, which timed out at ten minutes on this
# repo. The cause was history, not the working tree: four pushes on 2026-08-06
# left ~100 MB of large blobs behind, and removing them from HEAD did not help
# because the legacy build still fetches the repository. actions/checkout
# shallow-clones by default, so that history is never pulled.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        # fetch-depth: 1 is the default and is the point of this change.

      - name: Refuse to publish an artefact nobody chose
        # reports/<bibkey>/ sits next to a working directory whose files share
        # its prefix: report.tex, report.log, report.refined.pdf, and the
        # quarantined report.ink.json.MISPAIRED all match `report.*`. Three
        # sessions write into that library. An allowlist here means a stray
        # file fails the deploy loudly instead of going live quietly - the one
        # way a withdrawn or unreviewed artefact could reach the site without
        # anyone deciding to publish it.
        run: |
          python3 - <<'GUARD'
          import json, os, sys, glob

          ALLOWED = ("report.pdf", "report.ink.json", "inspect.html", "compare.html")
          errs = []

          if not os.path.isdir("reports"):
              print("::error::reports/ is missing - refusing to publish"); sys.exit(1)
          dirs = sorted(d for d in glob.glob("reports/*/") if os.path.isdir(d))
          if not dirs:
              print("::error::reports/ has no document folders - refusing to publish"); sys.exit(1)

          def content_ok(path, name):
              """Is this file the thing its name claims? Names are cheap to get
              right and prove nothing: a zero-byte report.pdf passes any check
              that only reads the filename."""
              n = os.path.getsize(path)
              if n == 0:
                  return "zero bytes"
              with open(path, "rb") as fh:
                  head = fh.read(1024)
                  fh.seek(max(0, n - 2048)); tail = fh.read()
              if name.endswith(".pdf"):
                  if not head.startswith(b"%PDF"):
                      return "no %%PDF header"
                  if b"%%EOF" not in tail:
                      return "no %%EOF trailer - truncated"
              elif name.endswith(".html"):
                  if b"<" not in head:
                      return "no markup"
              elif name.endswith(".json"):
                  try:
                      json.load(open(path, encoding="utf-8"))
                  except Exception as e:
                      return f"unparseable JSON: {e}"
              return None

          checked = 0
          for d in dirs:
              k = os.path.basename(d.rstrip("/"))
              for root, _, files in os.walk(d):
                  for b in sorted(files):
                      p = os.path.join(root, b)
                      checked += 1
                      if b not in ALLOWED and b != f"{k}.md":
                          errs.append((p, "unexpected file in a published report folder"))
                          continue
                      why = content_ok(p, b)
                      if why:
                          errs.append((p, f"named {b} but {why}"))

          # Counts make the verdict falsifiable at a glance; the content checks
          # make its INPUTS falsifiable. A guard that inspected nothing, and a
          # guard that inspected an empty file, both otherwise report success.
          if checked == 0:
              print("::error::guard inspected 0 files - refusing to publish"); sys.exit(1)
          for p, why in errs:
              print(f"::error file={p}::{why}: {p}")
          if errs:
              print(f"reports/: {len(errs)} problem(s) - refusing to publish"); sys.exit(1)
          print(f"reports/: {len(dirs)} document folders, {checked} files, "
                f"every one an allowed artefact and structurally valid")
          GUARD

      - name: Stage the site
        # Copy to a clean directory rather than uploading the checkout itself,
        # so .git and CI config can never end up in the published artifact.
        run: |
          mkdir -p _site
          # figures/ stays: index.html links figures/ and
          # figures/specs/overview.fig.json from the hero caption.
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.pstknot-work' \
            --exclude 'node_modules'
          test -f _site/.nojekyll || touch _site/.nojekyll
          echo "staged $(du -sh _site | cut -f1), $(find _site -type f | wc -l) files"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Default is 600000 (10 min), and this artifact is ~65 MB: the
          # deployment reached "deployment_in_progress" and was still running
          # when the action gave up and cancelled it. Give it 30 minutes.
          timeout: 1800000
          error_count: 10
          reporting_interval: 15000
